<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Retro Walkman Web</title>
    <style>
        :root {
            --body-color: #1a1a1a;
            --accent-color: #0055ff;
            --metal-texture: linear-gradient(135deg, #2b2b2b 0%, #1a1a1a 100%);
            --button-shadow: inset 2px 2px 5px rgba(255,255,255,0.1), inset -2px -2px 5px rgba(0,0,0,0.8);
        }

        body {
            background-color: #0d0d0d;
            color: white;
            font-family: 'Courier New', monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            overflow: hidden;
            user-select: none;
        }

        /* Carcasa del Walkman */
        .walkman-body {
            width: 320px;
            height: 500px;
            background: var(--metal-texture);
            border-radius: 20px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.8), inset 0 0 20px rgba(0,0,0,0.5);
            padding: 20px;
            position: relative;
            border: 4px solid #333;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        /* Ventana de la cinta */
        .cassette-window {
            background: #000;
            height: 200px;
            border-radius: 10px;
            border: 4px solid #444;
            position: relative;
            overflow: hidden;
            box-shadow: inset 0 0 10px rgba(0,0,0,1);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .cover-art {
            width: 100%;
            height: 100%;
            object-fit: cover;
            opacity: 0.8;
            transition: transform 0.5s ease;
        }

        .tape-reels {
            position: absolute;
            bottom: 20px;
            display: flex;
            gap: 40px;
            z-index: 2;
        }

        .reel {
            width: 60px;
            height: 60px;
            border: 4px dashed #ccc;
            border-radius: 50%;
            animation: spin 0s linear infinite;
        }

        @keyframes spin { 100% { transform: rotate(360deg); } }

        /* Panel de Control */
        .controls-area {
            background: #222;
            border-radius: 10px;
            padding: 15px;
            box-shadow: var(--button-shadow);
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 10px;
            align-items: center;
        }

        .btn {
            width: 45px;
            height: 45px;
            border-radius: 5px;
            border: none;
            background: #333;
            color: #fff;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 0 #000, 0 5px 10px rgba(0,0,0,0.5);
            transition: all 0.1s;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 18px;
            margin: 0 auto;
        }

        .btn:active {
            transform: translateY(4px);
            box-shadow: 0 0 0 #000, inset 0 2px 5px rgba(0,0,0,0.5);
        }

        .btn-play { background: #00aa00; }
        .btn-stop { background: #cc0000; }
        .btn-rew { background: #333; }
        .btn-fwd { background: #333; }
        .btn-pause { background: #ffaa00; }

        /* Display LCD */
        .lcd-display {
            background: #2b3a28;
            color: #8fbc8f;
            padding: 10px;
            border-radius: 5px;
            font-family: 'Digital-7', monospace;
            text-align: center;
            border: 2px solid #111;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.5);
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 14px;
        }

        /* Inputs ocultos */
        #file-input, #audio-input { display: none; }

        .upload-zone {
            text-align: center;
            font-size: 10px;
            color: #666;
            margin-top: 5px;
            cursor: pointer;
            text-decoration: underline;
        }

        .status-light {
            width: 10px;
            height: 10px;
            background: #300;
            border-radius: 50%;
            display: inline-block;
            margin-right: 5px;
        }
        .status-light.on { background: #f00; box-shadow: 0 0 5px #f00; }

        /* Efecto de distorsión al rebobinar */
        .distorted {
            filter: blur(2px) contrast(200%);
            transform: scaleX(0.9);
        }

        .message-overlay {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.8);
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            z-index: 100;
            padding: 20px;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <div class="walkman-body">
        <!-- Overlay inicial -->
        <div id="start-overlay" class="message-overlay">
            <p>Toque cualquier botón para encender el Walkman.<br><br>
            <small>Nota: Para la función "Anti-Instagram", use esto en un móvil Android añadiéndolo a la pantalla de inicio como App.</small></p>
        </div>

        <!-- Display -->
        <div class="lcd-display">
            <span><div class="status-light" id="power-led"></div>POWER</span>
            <span id="track-time">00:00</span>
            <span id="tape-state">STOP</span>
        </div>

        <!-- Ventana Cassette -->
        <div class="cassette-window">
            <img src="https://via.placeholder.com/300x200?text=No+Tape" class="cover-art" id="cover-img">
            <div class="tape-reels">
                <div class="reel" id="reel-left"></div>
                <div class="reel" id="reel-right"></div>
            </div>
        </div>

        <!-- Controles -->
        <div class="controls-area">
            <button class="btn btn-rew" id="btn-rew">⏪</button>
            <button class="btn btn-play" id="btn-play">▶</button>
            <button class="btn btn-pause" id="btn-pause">⏸</button>
            <button class="btn btn-stop" id="btn-stop">⏹</button>
            <button class="btn btn-fwd" id="btn-fwd">⏩</button>
        </div>

        <!-- Zona de carga -->
        <div style="margin-top: 10px; border-top: 1px solid #333; padding-top: 10px;">
            <label class="upload-zone">
                📷 Cambiar Portada
                <input type="file" id="file-input" accept="image/*">
            </label>
            <label class="upload-zone" style="display:block; margin-top:5px;">
                🎵 Cargar Canción (MP3)
                <input type="file" id="audio-input" accept="audio/*">
            </label>
        </div>
    </div>

    <script>
        // Elementos DOM
        const audio = new Audio();
        const playBtn = document.getElementById('btn-play');
        const pauseBtn = document.getElementById('btn-pause');
        const stopBtn = document.getElementById('btn-stop');
        const rewBtn = document.getElementById('btn-rew');
        const fwdBtn = document.getElementById('btn-fwd');
        const coverImg = document.getElementById('cover-img');
        const reelLeft = document.getElementById('reel-left');
        const reelRight = document.getElementById('reel-right');
        const timeDisplay = document.getElementById('track-time');
        const stateDisplay = document.getElementById('tape-state');
        const powerLed = document.getElementById('power-led');
        const overlay = document.getElementById('start-overlay');
        const fileInput = document.getElementById('file-input');
        const audioInput = document.getElementById('audio-input');

        let isPlaying = false;
        let isPowered = false;
        let rewindInterval;
        let fastForwardInterval;

        // Sonidos FX (Sintetizados para no depender de archivos externos)
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        
        function playClickSound() {
            if (!isPowered) return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'square';
            osc.frequency.setValueAtTime(800, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(100, audioCtx.currentTime + 0.1);
            gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.1);
        }

        function playMechanicalStartSound() {
            // Sonido de motor arrancando
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(50, audioCtx.currentTime);
            osc.frequency.linearRampToValueAtTime(100, audioCtx.currentTime + 0.5);
            gain.gain.setValueAtTime(0.05, audioCtx.currentTime);
            gain.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 0.5);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.5);
        }

        function playRewindSound() {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(200, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(50, audioCtx.currentTime + 0.2);
            gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
            gain.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 0.2);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.2);
        }

        // Inicialización
        document.addEventListener('click', () => {
            if (!isPowered) {
                audioCtx.resume();
                isPowered = true;
                overlay.style.display = 'none';
                powerLed.classList.add('on');
                playClickSound();
                stateDisplay.innerText = "READY";
            }
        }, { once: true });

        // Cargar Portada
        fileInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = (evt) => coverImg.src = evt.target.result;
                reader.readAsDataURL(file);
                playClickSound();
            }
        });

        // Cargar Canción
        audioInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                const url = URL.createObjectURL(file);
                audio.src = url;
                stateDisplay.innerText = "TAPE LOADED";
                playClickSound();
            }
        });

        // Lógica de Reproducción con Delay Mecánico
        playBtn.addEventListener('mousedown', () => {
            if (!isPowered || !audio.src) return;
            playClickSound();
            
            stateDisplay.innerText = "MECH...";
            playMechanicalStartSound();

            // Delay de 2 segundos como pedido
            setTimeout(() => {
                audio.play();
                isPlaying = true;
                stateDisplay.innerText = "PLAY";
                reelLeft.style.animation = "spin 2s linear infinite";
                reelRight.style.animation = "spin 2s linear infinite reverse";
                coverImg.classList.remove('distorted');
            }, 2000);
        });

        pauseBtn.addEventListener('mousedown', () => {
            if (!isPowered) return;
            playClickSound();
            audio.pause();
            isPlaying = false;
            stateDisplay.innerText = "PAUSE";
            reelLeft.style.animationPlayState = 'paused';
            reelRight.style.animationPlayState = 'paused';
        });

        stopBtn.addEventListener('mousedown', () => {
            if (!isPowered) return;
            playClickSound();
            audio.pause();
            audio.currentTime = 0;
            isPlaying = false;
            stateDisplay.innerText = "STOP";
            reelLeft.style.animation = 'none';
            reelRight.style.animation = 'none';
            coverImg.classList.remove('distorted');
        });

        // Rewind (Atrás con efecto)
        rewBtn.addEventListener('mousedown', () => {
            if (!isPowered) return;
            playClickSound();
            stateDisplay.innerText = "REW";
            coverImg.classList.add('distorted');
            
            // Sonido continuo de rebobinado
            const loopRew = setInterval(playRewindSound, 200);
            
            rewindInterval = setInterval(() => {
                if (audio.currentTime > 0) {
                    audio.currentTime -= 5; // Saltar atrás rápido
                } else {
                    clearInterval(rewindInterval);
                    clearInterval(loopRew);
                    stopBtn.click();
                }
            }, 100);

            rewBtn.onmouseup = () => {
                clearInterval(rewindInterval);
                clearInterval(loopRew);
                coverImg.classList.remove('distorted');
                if (isPlaying) stateDisplay.innerText = "PLAY";
                else stateDisplay.innerText = "STOP";
            };
        });

        // Fast Forward
        fwdBtn.addEventListener('mousedown', () => {
            if (!isPowered) return;
            playClickSound();
            stateDisplay.innerText = "FWD";
            
            fastForwardInterval = setInterval(() => {
                audio.currentTime += 5;
            }, 100);

            fwdBtn.onmouseup = () => {
                clearInterval(fastForwardInterval);
                if (isPlaying) stateDisplay.innerText = "PLAY";
                else stateDisplay.innerText = "STOP";
            };
        });

        // Actualizar tiempo
        audio.addEventListener('timeupdate', () => {
            const mins = Math.floor(audio.currentTime / 60);
            const secs = Math.floor(audio.currentTime % 60);
            timeDisplay.innerText = `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
        });

        // FUNCIÓN ANTI-DISTRACCIÓN (Instagram Blocker Simulation)
        // Cuando el usuario cambia de pestaña o minimiza la app, la música se para.
        document.addEventListener("visibilitychange", () => {
            if (document.hidden && isPlaying) {
                console.log("Usuario cambiando de app -> Pausando música");
                pauseBtn.click();
                stateDisplay.innerText = "BLOCKED";
                // Opcional: Podríamos mostrar un alert aquí si fuera una app nativa
            }
        });

        // También pausar si pierde el foco de la ventana
        window.addEventListener('blur', () => {
            if (isPlaying) {
                pauseBtn.click();
                stateDisplay.innerText = "FOCUS LOST";
            }
        });

    </script>
</body>
</html>
